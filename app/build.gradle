apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'
apply plugin: "androidx.navigation.safeargs.kotlin"

Properties hornsAppProperties = new Properties()

// The real value of these attributes will be in hornsapp/release.properties
def HORNS_APP_AD_MOB_APP_ID = "ca-app-pub-3940256099942544~3347511713"
def HORNS_APP_C_MAKE_FLAVOR = "-DFLAVOR=DEBUG"

// Add your values in {flavor}/release.properties file in order to get them here
if (project.file('src/hornsappRelease/release.properties').exists()) {
    hornsAppProperties.load(project.file('src/hornsappRelease/release.properties').newDataInputStream())
    // If you want the app use a specific ad mob key while develop
    if (hornsAppProperties.getProperty('AD_MOB_APP_ID')) {
        HORNS_APP_AD_MOB_APP_ID = hornsAppProperties.getProperty('AD_MOB_APP_ID')
    }
    // If you want the app use an specific endpoint while develop
    if (hornsAppProperties.getProperty('C_MAKE_FLAVOR')) {
        HORNS_APP_C_MAKE_FLAVOR = hornsAppProperties.getProperty('C_MAKE_FLAVOR')
    }
}

Properties muvinProperties = new Properties()

// The real value of these attributes will be in muvin/release.properties
def MUVIN_AD_MOB_APP_ID = "ca-app-pub-3940256099942544~3347511713"
def MUVIN_C_MAKE_FLAVOR = "-DFLAVOR=DEBUG"

// Add your values in {flavor}/release.properties file in order to get them here
if (project.file('src/muvinRelease/release.properties').exists()) {
    muvinProperties.load(project.file('src/muvinRelease/release.properties').newDataInputStream())
    // If you want the app use a specific ad mob key while develop
    if (muvinProperties.getProperty('AD_MOB_APP_ID')) {
        MUVIN_AD_MOB_APP_ID = muvinProperties.getProperty('AD_MOB_APP_ID')
    }
    // If you want the app use an specific endpoint while develop
    if (muvinProperties.getProperty('C_MAKE_FLAVOR')) {
        MUVIN_C_MAKE_FLAVOR = muvinProperties.getProperty('C_MAKE_FLAVOR')
    }
}

android {
    compileSdk 35
    defaultConfig {
        applicationId "com.yesferal"
        namespace = "com.yesferal.hornsapp.app"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 29
        versionName "2.6.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake { cppFlags "" }
        }
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        debug {
            debuggable true
            manifestPlaceholders.crashlyticsCollectionEnabled = "false"
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders.crashlyticsCollectionEnabled = "true"
        }
    }
    flavorDimensions = ["default"]
    productFlavors {
        create("hornsapp") {
            applicationIdSuffix = ".hornsapp"
            manifestPlaceholders.AD_MOB_APP_ID = HORNS_APP_AD_MOB_APP_ID
            externalNativeBuild.cmake {
                arguments HORNS_APP_C_MAKE_FLAVOR
            }
        }
        create("muvin") {
            applicationIdSuffix = ".muvin"
            manifestPlaceholders.AD_MOB_APP_ID = MUVIN_AD_MOB_APP_ID
            externalNativeBuild.cmake {
                arguments MUVIN_C_MAKE_FLAVOR
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = versions.jvmTarget
    }
}

dependencies {
    // Jar
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${versions.kotlin}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${versions.coroutines}"

    // Android
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // Retrofit - API request
    implementation "com.squareup.retrofit2:retrofit:${versions.retrofit}"
    implementation "com.squareup.retrofit2:converter-gson:${versions.retrofit}"

    // Own Libraries
    implementation 'com.github.Yesferal:HornsApp-DI:1.2.2'
    implementation 'com.github.Yesferal:HornsApp-Android-DI:1.2.2'
    // MavenLocal Core: com.yesferal.hornsapp.core:HornsApp-Core-jvm
    //implementation 'com.yesferal.hornsapp.core:HornsApp-Core-jvm:47.5.20'
    implementation 'com.github.Yesferal:HornsApp-Core:1.2.0'
    implementation 'com.github.Yesferal:DelegateAdapter:1.5.3'

    // ViewPager
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Picasso - Image
    implementation 'com.squareup.picasso:picasso:2.8'

    // Google
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-ads:24.2.0'

    // Import the BoM for the Firebase platform
    implementation(platform("com.google.firebase:firebase-bom:33.12.0"))
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    // Navigation
    implementation "androidx.navigation:navigation-fragment-ktx:${versions.navigation}"
    implementation "androidx.navigation:navigation-ui-ktx:${versions.navigation}"

    // Room
    implementation "androidx.room:room-runtime:${versions.room}"
    kapt "androidx.room:room-compiler:${versions.room}"

    //Socket.io
    implementation('io.socket:socket.io-client:2.0.1') {
        exclude group: 'org.json', module: 'json'
    }

    // required to avoid crash on Android 12 API 31
    implementation 'androidx.work:work-runtime-ktx:2.10.0'

    // Test Library
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
